<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="調査コードを照合する架空端末です。">
  <title>照合端末 | ミナセイメージング調査</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="terminal-page">
  <header class="site-header">
    <a class="brand" href="../index.html"><span class="brand-mark">MI</span><span>ミナセイメージング調査</span></a>
    <nav class="global-nav" aria-label="共通ナビゲーション">
      <a href="../site/index.html">トップ</a>
      <a href="../site/products.html">製品</a>
      <a href="../site/support.html">FAQ</a>

      <a href="../site/company.html">会社情報</a>
      <a href="index.html">照合端末</a>
    </nav>
  </header>
  <main>
    <section class="page-title">
      <h1>調査コード照合</h1>
      <p class="lead">公開情報から得たコードを入力してください。</p>
    </section>
    <div class="content">
      <section class="terminal-box">
        <h2>復元文書照合端末</h2>
        <p>形式: 機種コード-識別値-導入事例キー</p>
        <form class="terminal-form" data-terminal-form>
          <label class="visually-hidden" for="code-input">調査コード</label>
          <input id="code-input" data-code-input type="text" autocomplete="off" placeholder="MI0000-00000-KEY">
          <button class="button primary" type="submit">照合</button>
        </form>
        <p class="terminal-message" data-terminal-message aria-live="polite"></p>
      </section>
    </div>
  </main>
  <footer class="site-footer">
    <p>このサイトは謎解き企画用に作成された架空サイトです。実在の企業・製品・団体とは関係ありません。</p>
  </footer>
  <script src="../script.js"></script>
</body>
